[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
authors = ["Soeren Kejser Jensen <devel@kejserjensen.dk>"]

[workspace.dependencies]
arrow = "59.0.0"
arrow-flight = "59.0.0"
async-trait = "0.1.89"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
crossbeam-queue = "0.3.14"
dashmap = "6.2.1"
datafusion = "55.1.0"
datafusion-proto = "55.1.0"
delta_kernel = { package = "buoyant_kernel", version = "0.28.1" }
deltalake = "1.0.0"
dirs = "7.0.0"
futures = "0.3.32"
http = "1.5.0"
http-body-util = "0.1.5"
itertools = "0.15.0"
log = "0.4.34"
modelardb_auth = { path = "crates/modelardb_auth"}
modelardb_bulkloader = { path = "crates/modelardb_bulkloader"}
modelardb_client = { path = "crates/modelardb_client"}
modelardb_compression = { path = "crates/modelardb_compression"}
modelardb_embedded = { path = "crates/modelardb_embedded"}
modelardb_macros = { path = "crates/modelardb_macros"}
modelardb_server = { path = "crates/modelardb_server"}
modelardb_storage = { path = "crates/modelardb_storage"}
modelardb_test = { path = "crates/modelardb_test"}
modelardb_types = { path = "crates/modelardb_types"}
object_store = "0.13.2"
proptest = { version = "1.11.0", features = ["attr-macro"]}
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.9.1"
rand = "0.10.3"
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlparser = "0.62.0"
sysinfo = "0.39.6"
tempfile = "3.27.0"
tokio = "1.53.1"
tokio-stream = "0.1.19"
toml = "1.1.6"
tonic = "0.14.6"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = "1.26.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
panic = 'unwind'
